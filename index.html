<!doctype html>
<html lang="en" data-game="silhouette">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Silhouette · Geo Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Barlow+Semi+Condensed:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css?v=202610230100">
<style>
/* Silhouette: one big shape in a square frame, the answer box under it; the daily nine as a 3 x 3 board of small frames */
.silbox{position:relative;width:100%;max-width:340px;align-self:center;aspect-ratio:1;background:var(--sheet);border:1.5px solid var(--ink);border-radius:8px;box-shadow:var(--shadow);padding:14px;
  background-image:linear-gradient(var(--sea-soft) 1px,transparent 1px),linear-gradient(90deg,var(--sea-soft) 1px,transparent 1px);background-size:25% 25%;background-position:-1px -1px}
.silbox .sil{width:100%;height:100%;display:block;color:var(--ink)}
.silbox.right{border-color:var(--good)}.silbox.right .sil{color:var(--good)}
.silbox.wrong{border-color:var(--bad)}.silbox.wrong .sil{color:var(--bad)}
.silbox .turn{position:absolute;top:6px;right:8px;font-family:var(--mono);font-size:.7rem;color:var(--ink-2)}
.play{display:flex;flex-direction:column;gap:10px;width:100%}
.ans{display:flex;flex-direction:column;gap:6px}
.ans input{width:100%;border:1.5px solid var(--ink);border-radius:5px;padding:12px;font-size:1.1rem;background:var(--paper)}
.ans .sugg{max-height:none}
.tries{display:flex;align-items:center;gap:8px;font-size:.95rem;color:var(--ink-2)}
.tries i{width:12px;height:12px;border-radius:50%;background:var(--sea)}
.tries i.off{background:transparent;box-shadow:inset 0 0 0 1.5px var(--rule)}
.tries .cnt{margin-left:auto;font-family:var(--mono);font-size:.8rem}
.missed{margin:0;font-size:.92rem;color:var(--ink-2)}
.reveal{display:flex;align-items:center;gap:12px;background:var(--sheet);border:1.5px solid var(--good);border-radius:6px;padding:10px 12px}
.reveal.wrong{border-color:var(--bad)}
.reveal .flag{width:48px;height:36px;object-fit:cover;border-radius:3px;box-shadow:0 0 0 1px var(--rule);flex:none;background:var(--rule)}
.reveal .rn{display:flex;flex-direction:column;min-width:0}
.reveal .rn b{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:1.5rem;line-height:1}
.reveal .rn small{color:var(--ink-2);font-size:.9rem}
.reveal .pts{margin-left:auto;font-family:var(--mono);font-size:.85rem;white-space:nowrap}
.streak{display:flex;gap:16px;font-size:.95rem;color:var(--ink-2)}
.streak b{font-family:var(--display);font-weight:900;font-size:1.3rem;color:var(--ink);margin-right:4px}
.board9~.silbox{max-width:250px}
.board9{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%;max-width:340px;align-self:center}
.board9 button{aspect-ratio:1;background:var(--sheet);border:1.5px solid var(--rule);border-radius:6px;padding:6px;position:relative}
.board9 button .sil{width:100%;height:100%;display:block;color:var(--ink)}
.board9 button.sel{border-color:var(--ink);box-shadow:0 0 0 2px var(--sea)}
.board9 button.right{border-color:var(--good);background:var(--p4-soft)}.board9 button.right .sil{color:var(--good)}
.board9 button.wrong{border-color:var(--bad);background:var(--p0-soft)}.board9 button.wrong .sil{color:var(--bad)}
.board9 .n{position:absolute;top:3px;left:5px;font-family:var(--mono);font-size:.62rem;color:var(--ink-2)}
.board9 .nm{position:absolute;left:3px;right:3px;bottom:3px;font-size:.66rem;font-weight:700;line-height:1.05;text-align:center;background:var(--sheet);border-radius:3px;padding:1px 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dsq{grid-template-columns:repeat(3,1fr);width:60px}
.dsq i.mid{background:var(--p2)}
.dsq i.bad{background:var(--bad)}
.dtabs{width:100%}
.modes{max-width:320px;width:100%;align-self:center}
.difftag{font-family:var(--mono);font-size:.75rem;color:var(--sea);letter-spacing:.04em;text-transform:uppercase}
.soon{opacity:.55;box-shadow:none}
@media (prefers-reduced-motion:no-preference){.silbox.pop{animation:pop .35s cubic-bezier(.3,1.6,.6,1)}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<footer class="foot"><a class="linkbtn" href="https://hectorei19.github.io/geo-games/">More Geo Games</a></footer>
<div id="layer"></div>

<script src="countries.js?v=202610230100"></script>
<script src="silhouette.js?v=202610230100"></script>
<script src="games.js?v=202610230100"></script>
<script src="minigames.js?v=202610230100"></script>
<!-- flags appear once a shape is answered; loaded after the page so the game shows at once -->
<script defer src="flags.js?v=202610230100"></script>
<script>
/* ---- one silhouette to name: the same piece in Training, Daily and With friends ----
   A question is {c: country code, rot: turn in degrees (Hard), tries: wrong answers so far, st: 'play' | 'right' | 'wrong'}. */
const TRIES=3,DIFF_NAME={easy:'Easy',normal:'Normal',hard:'Hard'};
const DIFF_HINT={easy:'Well-known countries, north up',normal:'All 196 countries, north up',hard:'All 196, each shape turned'};
const newQ=(c,rot)=>({c,rot:rot||0,tries:[],st:'play'});
const flagSrc=c=>typeof FLAGS!=='undefined'&&FLAGS[c]?'data:image/svg+xml;utf8,'+encodeURIComponent(FLAGS[c]):'';
const contName={EU:'Europe',AS:'Asia',AF:'Africa',NA:'North and Central America',SA:'South America',OC:'Oceania'};
let query='',typing=false;
// apply an answer to a question; returns 'right', 'wrong' (a miss with tries left) or 'out' (last try used)
function answer(q,code){
  if(code===q.c){q.st='right';return 'right'}
  q.tries.push(code);if(q.tries.length>=TRIES){q.st='wrong';return 'out'}
  return 'wrong'}
function triesHTML(q){const left=TRIES-q.tries.length;
  return `<div class="tries" aria-label="${left} tries left">Tries ${Array.from({length:TRIES},(_,i)=>`<i class="${i<left?'':'off'}"></i>`).join('')}${q.rot?`<span class="cnt">Turned shape</span>`:''}</div>`+
    (q.tries.length?`<p class="missed">Not ${q.tries.map(c=>esc(byCode[c].n)).join(', not ')}.</p>`:'')}
function suggHTML(q){if(!query)return '';const res=searchCountries(query,null,6);
  if(!res.length)return `<li class="hint" style="padding:8px 2px">No country matches “${esc(query)}”.</li>`;
  return res.map(c=>{const t=q.tries.includes(c.c);return `<li><button data-g="${c.c}" ${t?'disabled':''}>${esc(c.n)}${t?'<span class="tag">not it</span>':''}</button></li>`}).join('')}
function answerBoxHTML(q,extra){
  return `<div class="ans"><input id="q" placeholder="Type a country…" autocomplete="off" autocapitalize="words" spellcheck="false" value="${esc(query)}" aria-label="Type a country"><ul class="sugg" id="sugg">${suggHTML(q)}</ul></div>${extra||''}`}
function revealHTML(q,note){const c=byCode[q.c],ok=q.st==='right';
  return `<div class="reveal ${ok?'':'wrong'}"><img class="flag" src="${flagSrc(q.c)}" alt=""><span class="rn"><b>${esc(c.n)}</b><small>${ok?(q.tries.length?'Right, at try '+(q.tries.length+1):'Right, first try'):'The answer'} · ${contName[c.r]||''}</small></span>${note?`<span class="pts">${note}</span>`:''}</div>`}
function silBoxHTML(q,big){const cls=q.st==='right'?'right':q.st==='wrong'?'wrong':'';
  return `<div class="silbox ${cls}${big?' pop':''}">${silSVG(q.c,q.rot)}</div>`}
// the answer box: typing filters the list; a tap or Enter (first match) answers
function bindAnswer(q,onPick){const box=$('q');if(!box)return;
  const draw=()=>{const u=$('sugg');if(u){u.innerHTML=suggHTML(q);u.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>onPick(b.dataset.g))}};
  box.oninput=e=>{query=e.target.value;draw()};
  box.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();const m=searchCountries(query,null,6).filter(c=>!q.tries.includes(c.c));if(m[0])onPick(m[0].c)}};
  draw();
  // the box gets the focus only once you have started, so phones do not open the keyboard on arrival
  if(query||typing)setTimeout(()=>{box.focus();box.setSelectionRange(box.value.length,box.value.length)},0)}
function feedback(q,res,code){const n=esc(byCode[code].n);
  if(res==='right')toast(byCode[q.c].n+'!','good');
  else if(res==='wrong')toast(`Not ${byCode[code].n}. ${TRIES-q.tries.length} ${TRIES-q.tries.length===1?'try':'tries'} left.`,'bad');
  else toast(`Not ${byCode[code].n}. It was ${byCode[q.c].n}.`,'bad')}

/* ---- Training: unlimited shapes, one after another, at the level you choose ----
   Each level deals from its own shuffled deck, so no country comes back until the deck is used up. */
let T=null;
const trainStats=()=>load('sil-train',{});
function trainNext(){const pool=poolOf(T.diff).map(c=>c.c);
  if(!T.deck||!T.deck.length)T.deck=shuffled(pool,Math.random).filter(c=>c!==(T.q&&T.q.c));
  const c=T.deck.pop();T.q=newQ(c,T.diff==='hard'?hardTurn(Math.random):0);query='';typing=false}
function openTrain(){const st=trainStats();
  T={diff:load('sil-diff','normal'),streak:0,deck:null,q:null,best:st};trainNext();view='train';render();window.scrollTo(0,0)}
function trainPick(code){const q=T.q;if(q.st!=='play')return;
  const res=answer(q,code);query='';typing=res==='wrong';
  const st=trainStats(),s=st[T.diff]||{n:0,ok:0,best:0};
  if(res!=='wrong'){s.n++;if(res==='right'){s.ok++;T.streak++;s.best=Math.max(s.best,T.streak)}else T.streak=0;st[T.diff]=s;store('sil-train',st)}
  feedback(q,res,code);render()}
function trainSkip(){const q=T.q;if(q.st!=='play')return;q.st='wrong';T.streak=0;
  const st=trainStats(),s=st[T.diff]||{n:0,ok:0,best:0};s.n++;st[T.diff]=s;store('sil-train',st);render()}
function trainHTML(){const q=T.q,s=trainStats()[T.diff]||{best:0},done=q.st!=='play';
  let h=header('Silhou<span>ette</span>','Training');
  h+=`<div class="backline"><button class="linkbtn" id="home">← Back</button><span class="ht">Training</span></div>`;
  h+=`<div class="field">${seg('diff',[['easy','Easy'],['normal','Normal'],['hard','Hard']],T.diff)}<span class="hint">${DIFF_HINT[T.diff]}.</span></div>`;
  h+=`<div class="streak"><span><b>${T.streak}</b>in a row</span><span><b>${s.best||0}</b>best at ${DIFF_NAME[T.diff]}</span></div>`;
  h+=`<section class="panel play">${silBoxHTML(q,done)}`;
  if(done)h+=revealHTML(q)+`<button class="primary" id="tnext">Next shape</button>`;
  else h+=triesHTML(q)+answerBoxHTML(q,`<button class="ghost" id="tskip" style="align-self:flex-start">Show the answer</button>`);
  return h+`</section>`}

/* ---- Daily: nine shapes on a 3 x 3 board, the same for everyone, one board per level ----
   Each level shuffles its countries once per cycle (same order for everyone, from the cycle number) and deals
   nine a day, so no country comes back until the cycle is over. Hard turns come from the date. */
const DAILY_FIRST='2026-10-22',DAILY_N=9;
function dailyBoard(key,diff){
  const codes=poolOf(diff).map(c=>c.c).sort(),days=Math.floor(codes.length/DAILY_N),n=dayNum(key,DAILY_FIRST)-1;
  const cycle=Math.floor(n/days),i=((n%days)+days)%days;
  const deck=shuffled(codes,rng(seedOf(`silhouette-${diff}-cycle-${cycle}`))).slice(i*DAILY_N,(i+1)*DAILY_N);
  const turn=rng(seedOf(`silhouette-hard-${key}`));
  return deck.map(c=>newQ(c,diff==='hard'?hardTurn(turn):0))}
let D=null;
const dailyAll=()=>{const d=load('sil-daily',null);return d&&d.date===todayKey()?d:{date:todayKey(),over:false}};
function dailyGame(diff){const d=dailyAll();
  return d[diff]||{diff,date:todayKey(),num:dayNum(todayKey(),DAILY_FIRST),qs:dailyBoard(todayKey(),diff),sel:0,over:false}}
function dailySave(){if(!D)return;const d=dailyAll();d[D.diff]=D;d.over=d.over||D.over;store('sil-daily',d);
  if(D.over){const h=load('sil-hist',{}),day=h[D.date]||{};if(day[D.diff]==null){day[D.diff]=D.qs.filter(q=>q.st==='right').length;h[D.date]=day;store('sil-hist',h)}}}
function dailyPick(code){const q=D.qs[D.sel];if(!q||q.st!=='play')return;
  const res=answer(q,code);query='';typing=res==='wrong';
  if(res!=='wrong'){const next=D.qs.findIndex((x,i)=>i>D.sel&&x.st==='play'),any=D.qs.findIndex(x=>x.st==='play');
    D.justDone=D.sel;if(any<0)D.over=true;else D.sel=next>=0?next:any}
  feedback(q,res,code);dailySave();
  if(D.over&&view==='home')view='daily';
  render();if(D.over)window.scrollTo(0,0)}
const rightOf=G=>G.qs.filter(q=>q.st==='right').length;
const sq=q=>q.st==='right'?(q.tries.length?'🟨':'🟩'):'🟥';
function dailyShareText(G){return `Silhouette #${G.num} · ${DIFF_NAME[G.diff]} — ${rightOf(G)}/9\n${[0,3,6].map(i=>G.qs.slice(i,i+3).map(sq).join('')).join('\n')}`}
const dailyShare=G=>dailyShareText(G)+"\n\nPlay today's Silhouette: "+pageLink();
function boardHTML(G){const sel=G.over?-1:G.sel;
  return `<div class="board9" role="group" aria-label="Today's nine shapes">${G.qs.map((q,i)=>{const cls=[i===sel?'sel':'',q.st==='right'?'right':q.st==='wrong'?'wrong':''].join(' ');
    return `<button data-tile="${i}" class="${cls}" aria-label="Shape ${i+1}${q.st==='play'?'':': '+esc(byCode[q.c].n)}">${silSVG(q.c,q.rot)}<span class="n">${i+1}</span>${q.st!=='play'?`<span class="nm">${esc(byCode[q.c].n)}</span>`:''}</button>`}).join('')}</div>`}
function dailyPlayHTML(G){const q=G.qs[G.sel],last=G.justDone!=null?G.qs[G.justDone]:null;G.justDone=null;
  let h=boardHTML(G);
  if(last&&last.st!=='play')h+=revealHTML(last);
  if(!G.over&&q){h+=`<span class="label">Shape ${G.sel+1} of 9 · ${rightOf(G)} right so far</span>`+silBoxHTML(q)+triesHTML(q)+answerBoxHTML(q)}
  return `<div class="play">${h}</div>`}
const dailyTabs=diff=>`<div class="dtabs">${seg('ddiff',[['easy','Easy'],['normal','Normal'],['hard','Hard']].map(([v,l])=>{const g=dailyAll()[v];return [v,l+(g&&g.over?' ✓':'')]}),diff)}</div>`;
function dailyResultHTML(G){const r=rightOf(G);
  return `<section class="panel"><span class="label">Silhouette #${G.num} · ${DIFF_NAME[G.diff]}</span><p class="big">${r} of 9</p>
    <p class="hint">${r===9?'Every shape named.':'Tap a shape to see its name.'} Next board in ${nextIn()}.</p>
    <pre class="sharebox" id="share">${esc(dailyShareText(G))}</pre>
    <div class="row-btns"><button class="ghost" id="copy" style="flex:1">Share</button><button class="ghost" data-go="train" style="flex:1">Training</button></div>
    ${['easy','normal','hard'].filter(v=>!(dailyAll()[v]||{}).over).length?`<p class="hint">Also today: ${['easy','normal','hard'].filter(v=>!(dailyAll()[v]||{}).over).map(v=>`<button class="linkbtn" data-dd="${v}" style="padding:0">${DIFF_NAME[v]}</button>`).join(' · ')}</p>`:''}
    ${nextGameHTML('silhouette')}
    <span class="label">Your daily boards</span>${statsHTML()}</section>`}
function openDaily(diff){if(diff)store('sil-ddiff',diff);D=dailyGame(diff||load('sil-ddiff','normal'));query='';view='daily';render();window.scrollTo(0,0)}
function dailyHTML(){let h=header('Silhou<span>ette</span>','Daily #'+D.num);
  h+=`<div class="backline"><button class="linkbtn" id="home">← Back</button><span class="ht">Today's shapes</span></div>`+dailyTabs(D.diff);
  if(D.over)h+=dailyResultHTML(D)+`<section class="panel play">${boardHTML(D)}</section>`;
  else h+=`<section class="panel">${dailyPlayHTML(D)}</section>`;
  return h}

/* ---- stats, rules, credits ---- */
function statsHTML(){const h=load('sil-hist',{}),days=Object.keys(h);
  const row=v=>{const ds=days.filter(k=>h[k][v]!=null),t=ds.reduce((x,k)=>x+h[k][v],0);return `<tr><td>${DIFF_NAME[v]}</td><td>${ds.length}</td><td>${ds.length?(t/ds.length).toFixed(1):'–'}</td><td>${ds.filter(k=>h[k][v]===9).length}</td></tr>`};
  const tr=load('sil-train',{});
  return `<div class="stgrid"><div class="st"><b>${days.length}</b><span>days played</span></div><div class="st"><b>${streakOf(h)}</b><span>streak</span></div></div>
    <table class="sttab"><tr><th>Daily</th><th>Played</th><th>Average</th><th>9 of 9</th></tr>${['easy','normal','hard'].map(row).join('')}</table>
    <table class="sttab"><tr><th>Training</th><th>Shapes</th><th>Right</th><th>Best run</th></tr>${['easy','normal','hard'].map(v=>{const s=tr[v]||{n:0,ok:0,best:0};return `<tr><td>${DIFF_NAME[v]}</td><td>${s.n}</td><td>${s.n?Math.round(s.ok/s.n*100)+'%':'–'}</td><td>${s.best}</td></tr>`}).join('')}</table>`}
const quickRules=extra=>`<section class="panel qrules"><span class="label">Quick rules</span><p class="hint">Name the country from its shape. Every shape fills the same frame, so size is no clue. You have ${TRIES} tries per shape.${extra||''}</p></section>`;
function rulesHTML(){return `<h3>The idea</h3><ul>
  <li>Each shape is the outline of a country. Type its name and pick it from the list.</li>
  <li>Every shape is drawn to fill the same frame, so a big country and a small one look the same size.</li>
  <li>You have <b>${TRIES} tries</b> per shape. Wrong answers are listed under the frame.</li>
  <li>Names are in English. Accents, capitals and spaces don't matter, and common other names work too (Holland, Burma, UK...).</li>
  <li>Only independent countries, never territories. Far-off islands are left out of a shape (Hawaii, French Guiana, the Canaries) so the country does not shrink to a dot. Vatican City is not in the game.</li></ul>
  <h3>Levels</h3><ul>
  <li><b>Easy</b>: 54 countries most people know from maps, news and travel, north up.</li>
  <li><b>Normal</b>: all 196 countries, north up.</li>
  <li><b>Hard</b>: all 196, each shape turned by a random angle, so north is no clue.</li></ul>
  <h3>Modes</h3><ul>
  <li><b>Today's shapes</b>: nine shapes on a 3 × 3 board, the same for everyone, one board per level, new every day at midnight CET. One try each, saved on this device.</li>
  <li><b>Training</b>: unlimited shapes at the level you choose. No country comes back until you have seen them all.</li>
  <li><b>With friends</b>: online rooms, coming soon.</li></ul>`}
function creditsHTML(){return `<ul class="helpbox" style="padding-left:18px">
  <li>Borders: <a href="https://github.com/topojson/world-atlas" target="_blank" rel="noopener">world-atlas</a>, from <a href="https://www.naturalearthdata.com/" target="_blank" rel="noopener">Natural Earth</a> 1:10m (public domain). Each country is drawn on its own map centred on itself, so no shape is stretched or cut by the date line.</li>
  <li>Country names, other names and continents: Country Grid's data, from <a href="https://github.com/mledoze/countries" target="_blank" rel="noopener">mledoze/countries</a> (ODbL 1.0).</li>
  <li>Flags: <a href="https://github.com/lipis/flag-icons" target="_blank" rel="noopener">flag-icons</a> (MIT License).</li>
  <li>Fonts: Big Shoulders Display, Barlow Semi Condensed, JetBrains Mono (Google Fonts, SIL Open Font License).</li></ul>`}

/* ---- home: today's board open and playable on top, then Training and With friends, as in the other games ---- */
let view='home';
const seg=(name,opts,val)=>`<div class="seg" role="group">${opts.map(([v,l])=>`<button type="button" data-seg="${name}" data-v="${v}" aria-pressed="${String(v)===String(val)}">${l}</button>`).join('')}</div>`;
const dateLabel=k=>new Date(k+'T12:00Z').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',timeZone:'UTC'});
function homeHTML(){const key=todayKey(),diff=load('sil-ddiff','normal');
  if(!D||D.date!==key||D.diff!==diff)D=dailyGame(diff);
  let daily;
  if(D.over){const h=load('sil-hist',{});
    daily=`<button class="hcard" id="daily"><span class="hm">Today's shapes #${D.num} · ${DIFF_NAME[D.diff]} · done</span><span class="dsum"><span class="dsq" aria-hidden="true">${D.qs.map(q=>`<i class="${q.st==='right'?(q.tries.length?'mid':'on'):'bad'}"></i>`).join('')}</span><span class="dtxt"><span class="ht">${rightOf(D)} of 9</span><span class="hs">shapes named</span></span><span class="dstats"><span><b>${streakOf(h)}</b>streak</span><span><b>${Object.keys(h).length}</b>played</span></span></span><span class="hs">Tap to see the board and share your result.</span><span class="hm">Next board in ${nextIn()}</span></button>`}
  else daily=`<div class="hcard ac play"><span class="hm">#${D.num} · ${dateLabel(key)}</span><span class="ht">Today's shapes</span><span class="hs">${D.qs.some(q=>q.st!=='play')?'You started it: keep going.':'Nine countries, the same for everyone. Tap a shape or type to start.'}</span>${dailyPlayHTML(D)}</div>`;
  return header('Silhou<span>ette</span>','',true)+`<section class="home">${dailyTabs(D.diff)}${daily}
    <div class="hrow"><button class="hcard" data-go="train"><span class="ht">Training</span><span class="hs">Unlimited shapes, at the level you choose.</span></button>
    <div class="hcard soon" aria-disabled="true"><span class="ht">With friends</span><span class="hs">Play online, 2 to 6 players.</span><span class="hm">(coming soon)</span></div></div></section>
    ${quickRules(' Full rules in <b>How to play</b>.')}`}
function goHome(){view='home';toastMsg=null;drawToast();query='';typing=false;render();window.scrollTo(0,0)}
function render(){
  if(view==='train')app.innerHTML=trainHTML();
  else if(view==='daily')app.innerHTML=dailyHTML();
  else app.innerHTML=homeHTML();
  bind()}
function bind(){
  if($('home'))$('home').onclick=goHome;
  app.querySelectorAll('[data-go="train"]').forEach(b=>b.onclick=openTrain);
  if($('daily'))$('daily').onclick=()=>openDaily();
  if($('copy'))$('copy').onclick=()=>share(dailyShare(D));
  app.querySelectorAll('[data-dd]').forEach(b=>b.onclick=()=>openDaily(b.dataset.dd));
  // the level of today's board: on the home screen it switches the open board; on the daily screen too
  app.querySelectorAll('[data-seg="ddiff"]').forEach(b=>b.onclick=()=>{store('sil-ddiff',b.dataset.v);D=dailyGame(b.dataset.v);query='';typing=false;
    if(view==='daily'||D.over&&view!=='home')view='daily';render()});
  app.querySelectorAll('[data-tile]').forEach(b=>b.onclick=()=>{const i=+b.dataset.tile;
    if(D.over||D.qs[i].st!=='play'){toast(byCode[D.qs[i].c].n);return}
    D.sel=i;query='';typing=true;dailySave();render()});
  if(view==='train'){
    app.querySelectorAll('[data-seg="diff"]').forEach(b=>b.onclick=()=>{T.diff=b.dataset.v;store('sil-diff',T.diff);T.deck=null;T.streak=0;trainNext();render()});
    if($('tnext'))$('tnext').onclick=()=>{trainNext();typing=true;render()};
    if($('tskip'))$('tskip').onclick=trainSkip;
    bindAnswer(T.q,trainPick);
    if($('tnext')&&!TOUCH)$('tnext').focus()}
  else if(D&&!D.over)bindAnswer(D.qs[D.sel],dailyPick)}
// Enter on a revealed Training shape goes to the next one
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&view==='train'&&T&&T.q.st!=='play'&&!$('dok')&&e.target.id!=='q'&&document.activeElement!==$('tnext')){e.preventDefault();trainNext();typing=true;render()}});
// once the flags have loaded, show the one of a revealed shape
window.addEventListener('load',()=>{if(document.querySelector('.reveal .flag'))render()},{once:true});
render();
</script>
</body>
</html>
